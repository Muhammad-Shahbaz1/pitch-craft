<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Inner Presentation Screen -->
  <rect x="12" y="14" width="40" height="26" rx="4" fill="#090d16" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8" filter="url(#glow)" />
  
  <!-- Presentation Screen Stand -->
  <path d="M32 40V48M24 48H40" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Slide Content / Growth Chart Bars -->
  <rect x="18" y="28" width="4" height="8" rx="1" fill="#38bdf8" />
  <rect x="25" y="23" width="4" height="13" rx="1" fill="#60a5fa" />
  <rect x="32" y="19" width="4" height="17" rx="1" fill="#818cf8" />
  <path d="M18 27L27 21L34 17" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- AI Magic Sparkle / Star in Screen -->
  <path d="M43 19C43 19 44 22 47 22C44 22 43 25 43 25C43 25 42 22 39 22C42 22 43 19 43 19Z" fill="#fbbf24" />
</svg>
